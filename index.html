            const file = e.target.files && e.target.files[0];
            if (!file) return;
            setErrorMsg('');
            setIsCompressing(true);
            try {
                const res = await readOriginalMediaFile(file);
                setImagePreview(res.dataUrl);
                setImageBase64(res.base64);
                setImageMime(res.mime);
                setImageName(res.name);
            } catch (err) {
                setErrorMsg((err && err.message) || 'Failed to read selected media file.');
            } finally {
                setIsCompressing(false);
            }
        };

        const handleExtraImageUpload = async (e) => {
            const files = Array.from((e.target && e.target.files) || []);
            if (files.length === 0) return;
            setErrorMsg('');
            setIsCompressing(true);
            try {
                const added = [];
                for (const file of files) {
                    const res = await readOriginalMediaFile(file);
                    added.push({
                        id: 'img_' + Math.random().toString(36).slice(2, 8),
                        url: res.dataUrl,
                        mime: res.mime,
                        caption: extraCaptionInput.trim(),
                        name: res.name
                    });
                }
                setExtraImages(prev => [...prev, ...added]);
                setExtraCaptionInput('');
                if (extraFileInputRef.current) extraFileInputRef.current.value = '';
            } catch (err) {
                setErrorMsg((err && err.message) || 'Failed to read additional media file.');
            } finally {
                setIsCompressing(false);
            }
        };

        const handlePasteImageFile = async (file, forceExtra = false) => {
            if (!file) return;
            setErrorMsg('');
            setIsCompressing(true);
            try {
                const res = await readOriginalMediaFile(file);
                if (!forceExtra && !imagePreview && !imageUrlInput) {
                    setImagePreview(res.dataUrl);
                    setImageBase64(res.base64);
                    setImageMime(res.mime);
                    setImageName(res.name || 'pasted_image.png');
                    setPasteNotice('Pasted image into Primary Hero!');
                } else {
                    setExtraImages(prev => [
                        ...prev,
                        {
                            id: 'img_' + Math.random().toString(36).slice(2, 8),
                            url: res.dataUrl,
                            mime: res.mime,
                            caption: extraCaptionInput.trim(),
                            name: res.name || 'pasted_image.png'
                        }
                    ]);
                    setExtraCaptionInput('');
                    setPasteNotice('Pasted image into Additional Inline Photos!');
                }
                setTimeout(() => setPasteNotice(''), 2500);
            } catch (err) {
                setErrorMsg((err && err.message) || 'Failed to read pasted image.');
            } finally {
                setIsCompressing(false);
            }
        };

        const handleFormPaste = (e, forceExtra = false) => {
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (item && item.type && item.type.indexOf('image') !== -1) {
                    const file = item.getAsFile();
                    if (file) {
                        e.preventDefault();
                        handlePasteImageFile(file, forceExtra);
                        return;
                    }
                }
            }
        };

        const handlePasteFromClipboardButton = async (forceExtra = false) => {
            setErrorMsg('');
            try {
                if (!navigator.clipboard || !navigator.clipboard.read) {
                    setPasteNotice('Press Ctrl+V anywhere in this form to paste your copied image.');
                    setTimeout(() => setPasteNotice(''), 3000);
                    return;
                }
                const clipItems = await navigator.clipboard.read();
                for (const clipItem of clipItems) {
                    const imgType = clipItem.types.find(t => t.startsWith('image/'));
                    if (imgType) {
                        const blob = await clipItem.getType(imgType);
                        const ext = imgType.split('/')[1] || 'png';
                        const file = new File([blob], `pasted_${Date.now()}.${ext}`, { type: imgType });
                        await handlePasteImageFile(file, forceExtra);
                        return;
                    }
                }
                setPasteNotice('No image found in clipboard. Copy an image first or press Ctrl+V.');
                setTimeout(() => setPasteNotice(''), 3000);
            } catch (err) {
                setPasteNotice('Press Ctrl+V anywhere in this form to paste your copied image.');
                setTimeout(() => setPasteNotice(''), 3000);
            }
        };

        const handleAddExtraImageUrl = () => {
            const url = extraUrlInput.trim();
            if (!url) return;
            setExtraImages(prev => [
                ...prev,
                {
                    id: 'img_' + Math.random().toString(36).slice(2, 8),
                    url,
                    caption: extraCaptionInput.trim(),
                    name: 'External Image'
                }
            ]);
            setExtraUrlInput('');
            setExtraCaptionInput('');
        };

        const updateExtraImageCaption = (id, caption) => {
            setExtraImages(prev => prev.map(img => img.id === id ? { ...img, caption } : img));
        };

        const removeExtraImage = (id) => {
            setExtraImages(prev => prev.filter(img => img.id !== id));
        };

        const clearImage = () => {
            setImagePreview('');
            setImageUrlInput('');
            setImageBase64('');
            setImageName('');
            setImageMime('');
            if (fileInputRef.current) fileInputRef.current.value = '';
        };

        const resetFormForNext = () => {
            setEditingArticle(null);
            setHeadline('');
            setBody('');
            setCategories('');
            setCustomHashtag('');
            setIsHeaderPin(false);
            setHeaderDuration('until_next');
            clearImage();
            setExtraImages([]);
            setExtraUrlInput('');
            setExtraCaptionInput('');
            setPublishedWhatsAppText('');
            setPublishStatus('');
            setErrorMsg('');
            setCopiedWhatsApp(false);
            setEditorTab('write');
        };

        // Compose body string including any extraImages as [IMAGE: url | caption] blocks
        // interleaved between paragraphs so Google Sheets stores them in the body column seamlessly.
        const composeBodyWithExtraImages = useCallback((rawBodyText, extras) => {
            const cleanText = String(rawBodyText || '').trim();
            if (!Array.isArray(extras) || extras.length === 0) return cleanText;
            const paras = cleanText.split(/\n\s*\n/).filter(p => p.trim().length > 0);
            const unplaced = extras.filter(img => img && img.url && !cleanText.includes(img.url));
            if (unplaced.length === 0) return cleanText;

            const out = [];
            let extraIdx = 0;
            paras.forEach((p, idx) => {
                out.push(p);
                if (extraIdx < unplaced.length && (idx + 1) % 2 === 0) {
                    const img = unplaced[extraIdx++];
                    out.push(`[IMAGE: ${img.url}${img.caption ? ' | ' + img.caption : ''}]`);
                }
            });
            while (extraIdx < unplaced.length) {
                const img = unplaced[extraIdx++];
                out.push(`[IMAGE: ${img.url}${img.caption ? ' | ' + img.caption : ''}]`);
            }
            return out.join('\n\n');
        }, []);

        // Draft article object for Live Preview
        const draftPreviewArticle = useMemo(() => {
            const trimmedHeadline = headline.trim() || 'Untitled Student News Story';
            const trimmedAuthor = (author || '').trim() || 'Y.C';
            const normalizedTagList = normalizeStudentTags(categories);
            const heroUrl = imagePreview || imageUrlInput.trim() || 'https://placehold.co/1200x675/111111/ffffff?text=NSNC+STUDENT+NEWS';
            const combinedSummary = composeBodyWithExtraImages(
                body.trim() || 'Start writing your article body in the Write / Edit tab to preview how paragraphs and multiple inline images flow in the ABC News-style editorial reader.',
                extraImages
            );
            return {
                id: editingArticle ? editingArticle.id : 'draft_preview',
                title: trimmedHeadline,
                summary: combinedSummary,
                image_url: heroUrl,
                images: [
                    ...(heroUrl ? [{ url: heroUrl, caption: trimmedHeadline }] : []),
                    ...extraImages.map(e => ({ url: e.url, caption: e.caption || trimmedHeadline }))
                ],
                published_at: editingArticle ? editingArticle.published_at : new Date().toISOString(),
                source: 'NSNC CHANNEL',
                cat: 'STUDENT NEWS',
                sourceId: 'nsnc_student',
                isStudentNews: true,
                author: trimmedAuthor,
                tags: normalizedTagList.length > 0 ? normalizedTagList : ['#Australia', '#NSW']
            };
        }, [headline, author, categories, imagePreview, imageUrlInput, body, extraImages, editingArticle, composeBodyWithExtraImages]);

        const handlePublish = async (e) => {
            if (e && e.preventDefault) e.preventDefault();
            setErrorMsg('');

            const trimmedHeadline = headline.trim();
            const trimmedBody = body.trim();
            const trimmedAuthor = (author || '').trim() || 'Y.C';
            const normalizedTagList = normalizeStudentTags(categories);
            const normalizedCats = normalizedTagList.join(' ') || '#Australia #News';

            if (!trimmedHeadline) {
                setErrorMsg('Please enter a headline.');
                setEditorTab('write');
                return;
            }
            if (!trimmedBody) {
                setErrorMsg('Please enter the article body.');
                setEditorTab('write');
                return;
            }

            const studentSource = API_SOURCES.find(s => s.id === 'nsnc_student');
            const endpoint = studentSource && studentSource.url;
            if (!endpoint || endpoint === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
                setErrorMsg('Google Apps Script Web App URL is not configured yet in API_SOURCES.');
                return;
            }

            const finalHeroUrl = imagePreview || imageUrlInput.trim() || (editingArticle && editingArticle.image_url) || '';
            const serializedBody = composeBodyWithExtraImages(trimmedBody, extraImages);

            let headerMarker = '';
            let headerMetaObj = { isHeader: false, mode: 'none', expiresAt: null };
            if (isHeaderPin) {
                if (headerDuration === 'until_next') {
                    headerMarker = '[HEADER:UNTIL_NEXT]';
                    headerMetaObj = { isHeader: true, mode: 'until_next', expiresAt: null };
                } else {
                    const durationDaysMap = { '1d': 1, '2d': 2, '3d': 3, '7d': 7 };
                    const days = durationDaysMap[headerDuration] || 1;
                    const expTs = Date.now() + days * 24 * 60 * 60 * 1000;
                    headerMarker = `[HEADER:EXP_${expTs}]`;
                    headerMetaObj = { isHeader: true, mode: 'timed', expiresAt: expTs };
                }
            }
            const categoriesWithHeader = headerMarker ? `${normalizedCats} ${headerMarker}` : normalizedCats;

            setIsPublishing(true);
            setPublishStatus(editingArticle ? 'Saving changes...' : 'Publishing...');
            try {
                // If editing an existing article, always persist local override immediately so edits appear right away
                if (editingArticle) {
                    const updatedObj = {
                        ...editingArticle,
                        title: trimmedHeadline,
                        summary: serializedBody,
                        author: trimmedAuthor,
                        tags: normalizedTagList.length > 0 ? normalizedTagList : ['#Australia', '#News'],
                        rawCategories: categoriesWithHeader,
                        headerMeta: headerMetaObj,
                        image_url: finalHeroUrl || editingArticle.image_url,
                        images: [
                            ...(finalHeroUrl ? [{ url: finalHeroUrl, caption: trimmedHeadline }] : []),
                            ...extraImages.map(x => ({ url: x.url, caption: x.caption || trimmedHeadline }))
                        ]
                    };
                    saveStoredStudentEdit(editingArticle.id, editingArticle.title, updatedObj);
                    if (onSaveLocalEdit) onSaveLocalEdit(updatedObj);
                }

                const payload = {
                    secret: (() => { try { return sessionStorage.getItem('nsnc_admin_publish_secret') || localStorage.getItem('nsnc_admin_publish_secret') || ''; } catch (e) { return ''; } })(),
                    action: editingArticle ? 'edit' : 'publish',
                    id: editingArticle ? String(editingArticle.id).replace(/^sheet_/, '') : undefined,
                    headline: trimmedHeadline,
                    body: serializedBody,
                    categories: categoriesWithHeader,
                    author: trimmedAuthor,
                    imageBase64: imageBase64 || '',
                    imageName: imageName || '',
                    imageMime: imageMime || '',
                    imageUrl: (!imageBase64 && finalHeroUrl && !finalHeroUrl.startsWith('data:')) ? finalHeroUrl : ''
                };

                const bodyString = JSON.stringify(payload);
                let usedNoCorsFallback = false;

                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: bodyString
                    });

                    const text = await res.text();
                    let json = null;
                    try { json = JSON.parse(text); } catch (err) {}

                    if (!res.ok || (json && json.error)) {
                        if (!editingArticle) {
                            throw new Error((json && json.error) || `Publish failed (HTTP ${res.status})`);
                        }
                    }
                } catch (fetchErr) {
                    const isCorsTypeError = (fetchErr instanceof TypeError) || /failed to fetch|networkerror|cors|load failed/i.test(String(fetchErr && fetchErr.message || ''));
                    if (!isCorsTypeError) {
                        throw fetchErr;
                    }
                    // Fallback for file:// (null origin) or strict CORS redirect: send with mode: 'no-cors'
                    usedNoCorsFallback = true;
                    setPublishStatus('Sending to Google Sheet...');
                    await fetch(endpoint, {
                        method: 'POST',
                        mode: 'no-cors',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: bodyString
                    });
                }

                if (usedNoCorsFallback) {
                    setPublishStatus('Syncing Sheet1...');
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }

                try { localStorage.removeItem('nsnc_admin_autosave_draft'); } catch (e) {}
                if (activeDraftId) {
                    persistDrafts(drafts.filter(d => d.id !== activeDraftId));
                    setActiveDraftId(null);
                }
                if (onPublishSuccess) onPublishSuccess();
                const formattedWhatsApp = `_${normalizedCats} | Article by ${trimmedAuthor}_\n\n${trimmedHeadline}\n\n${trimmedBody}`;
                setPublishedWhatsAppText(formattedWhatsApp);
                setPublishStatus(editingArticle ? 'Article updated and Sheet1 reloaded!' : 'Article published and Sheet1 reloaded!');

                if (usedNoCorsFallback) {
                    setTimeout(() => {
                        if (onClose) onClose();
                    }, 1200);
                }
            } catch (err) {
                if (editingArticle) {
                    const formattedWhatsApp = `_${normalizedCats} | Article by ${trimmedAuthor}_\n\n${trimmedHeadline}\n\n${trimmedBody}`;
                    setPublishedWhatsAppText(formattedWhatsApp);
                    setPublishStatus('Saved locally and synced.');
                    if (onPublishSuccess) onPublishSuccess();
                } else {
                    setPublishStatus('');
                    setErrorMsg((err && err.message) ? err.message : 'Failed to publish article. Please check your connection and Web App URL.');
                }
            } finally {
                setIsPublishing(false);
            }
        };

        const handleCopyWhatsApp = () => {
            if (!publishedWhatsAppText) return;
            const markCopied = () => {
                setCopiedWhatsApp(true);
                setTimeout(() => setCopiedWhatsApp(false), 2200);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(publishedWhatsAppText).then(markCopied).catch(() => {});
            } else {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = publishedWhatsAppText;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    markCopied();
                } catch (err) {}
            }
        };

        const activeTagSet = new Set(normalizeStudentTags(categories).map(t => t.toLowerCase()));
        const filteredManageArticles = useMemo(() => {
            const q = manageSearch.trim().toLowerCase();
            return (Array.isArray(studentArticles) ? studentArticles : []).filter(a => {
                if (!a) return false;
                if (!q) return true;
                return (
                    String(a.title || '').toLowerCase().includes(q) ||
                    String(a.author || '').toLowerCase().includes(q) ||
                    String(a.summary || '').toLowerCase().includes(q)
                );
            });
        }, [studentArticles, manageSearch]);

        const previewFlowBlocks = useMemo(() => buildArticleFlowBlocks(draftPreviewArticle), [draftPreviewArticle]);

        const bevelRaised = {
            backgroundColor: '#D4D0C8',
            borderTop: '2px solid #FFFFFF',
            borderLeft: '2px solid #FFFFFF',
            borderRight: '2px solid #404040',
            borderBottom: '2px solid #404040',
            color: '#000000'
        };
        const bevelBtn = {
            backgroundColor: '#D4D0C8',
            color: '#000000',
            borderTop: '2px solid #FFFFFF',
            borderLeft: '2px solid #FFFFFF',
            borderRight: '2px solid #404040',
            borderBottom: '2px solid #404040',
            fontSize: '11px',
            fontWeight: 700,
            padding: '4px 12px',
            cursor: 'pointer'
        };
        const bevelBtnPrimary = {
            ...bevelBtn,
            backgroundColor: '#000080',
            color: '#FFFFFF',
            borderTop: '2px solid #5B7FD6',
            borderLeft: '2px solid #5B7FD6',
            borderRight: '2px solid #000033',
            borderBottom: '2px solid #000033'
        };
        const sunkenInput = {
            backgroundColor: '#FFFFFF',
            color: '#000000',
            borderTop: '2px solid #808080',
            borderLeft: '2px solid #808080',
            borderRight: '2px solid #FFFFFF',
            borderBottom: '2px solid #FFFFFF',
            fontSize: '12px',
            padding: '6px 8px',
            outline: 'none'
        };
        const groupBox = {
            border: '1px solid #808080',
            boxShadow: 'inset 1px 1px 0 #FFFFFF',
            backgroundColor: '#D4D0C8',
            padding: '12px'
        };

        return (
            <div className={`modal-overlay admin-modal-overlay ${isOpen ? 'show' : ''}`} style={{ backgroundColor: 'rgba(0,0,0,0.68)' }} onClick={onClose}>
                <div
                    className="w-full h-full flex items-center justify-center p-2 sm:p-5"
                    onClick={e => e.stopPropagation()}
                >
                    <div
                        className="w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden"
                        style={{
                            ...bevelRaised,
                            fontFamily: 'Tahoma, Verdana, Arial, sans-serif',
                            boxShadow: '5px 5px 0px rgba(0, 0, 0, 0.5)'
                        }}
                    >
                        {/* Classic 2000s Windows Title Bar */}
                        <div
                            className="px-2.5 py-1.5 flex items-center justify-between gap-2 select-none shrink-0"
                            style={{
                                background: 'linear-gradient(90deg, #000080 0%, #1084D0 100%)',
                                color: '#FFFFFF'
                            }}
                        >
                            <div className="flex items-center gap-2 min-w-0">
                                <span
                                    style={{
                                        display: 'inline-block',
                                        width: '14px',
                                        height: '14px',
                                        backgroundColor: '#FFFFFF',
                                        color: '#000080',
                                        fontSize: '10px',
                                        fontWeight: 900,
                                        textAlign: 'center',
                                        lineHeight: '14px',
                                        border: '1px solid #000040',
                                        flexShrink: 0
                                    }}
                                >
                                    N
                                </span>
                                <span className="text-xs font-bold tracking-wide truncate">
                                    NSNC Editorial Studio | {!isAuthenticated ? 'Admin Logon' : (editingArticle ? 'Edit Student Article' : 'Compose & Publish')}
                                </span>
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0">
                                {isAuthenticated && editingArticle && (
                                    <button
                                        type="button"
                                        onClick={resetFormForNext}
                                        style={{ ...bevelBtn, padding: '2px 8px', fontSize: '11px' }}
                                    >
                                        + New Article
                                    </button>
                                )}
                                {isAuthenticated && (
                                    <button
                                        type="button"
                                        onClick={handleLogout}
                                        style={{ ...bevelBtn, padding: '2px 8px', fontSize: '11px', color: '#8B0000' }}
                                    >
                                        Sign Out
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={onClose}
                                    aria-label="Close Publish Tool"
                                    style={{
                                        ...bevelBtn,
                                        padding: '1px 7px',
                                        fontSize: '12px',
                                        lineHeight: '16px',
                                        fontWeight: 900
                                    }}
                                >
                                    X
                                </button>
                            </div>
                        </div>

                        {/* Classic 2000s Property-Sheet Tabs */}
                        {isAuthenticated && !publishedWhatsAppText && (
                            <div
                                className="px-3 pt-2 flex items-end gap-1 flex-wrap shrink-0"
                                style={{ backgroundColor: '#D4D0C8', borderBottom: '1px solid #808080' }}
                            >
                                {[
                                    { id: 'write', label: `1. ${editingArticle ? 'Edit Article' : 'Write Article'}` },
                                    { id: 'preview', label: '2. Live Preview' },
                                    { id: 'manage', label: `3. Manage & Edit (${Array.isArray(studentArticles) ? studentArticles.length : 0})` },
                                    { id: 'drafts', label: `4. Drafts (${drafts.length})` }
                                ].map(tab => {
                                    const active = editorTab === tab.id;
                                    return (
                                        <button
                                            key={tab.id}
                                            type="button"
                                            onClick={() => setEditorTab(tab.id)}
                                            style={{
                                                backgroundColor: active ? '#D4D0C8' : '#C0BCB4',
                                                color: '#000000',
                                                fontSize: '11px',
                                                fontWeight: active ? 700 : 400,
                                                padding: active ? '5px 14px 6px 14px' : '4px 12px',
                                                marginBottom: active ? '-1px' : '0px',
                                                borderTop: '2px solid #FFFFFF',
                                                borderLeft: '2px solid #FFFFFF',
                                                borderRight: '2px solid #404040',
                                                borderBottom: active ? '1px solid #D4D0C8' : '1px solid #808080',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            {tab.label}
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        {/* Scrollable Window Body */}
                        <div
                            className="flex-1 overflow-y-auto p-3 sm:p-4 space-y-4"
                            style={{ backgroundColor: '#D4D0C8', color: '#000000' }}
                        >
                            {!isAuthenticated ? (
                                <form onSubmit={handleLoginSubmit} className="max-w-md mx-auto my-6" style={groupBox}>
                                    <div
                                        className="px-3 py-2 mb-4 flex items-center justify-between"
                                        style={{ backgroundColor: '#000080', color: '#FFFFFF' }}
                                    >
                                        <span className="text-xs font-bold">NSNC Editorial Logon</span>
                                        <span className="text-[10px]">Restricted Access</span>
                                    </div>

                                    <p className="text-xs mb-4" style={{ color: '#222222' }}>
                                        Enter your authorized NSNC Editorial ID and password to compose, edit, or publish articles.
                                    </p>

                                    {isLoginLocked ? (
                                        <div
                                            className="mb-3 px-3 py-2.5 text-xs font-bold space-y-1"
                                            style={{ backgroundColor: '#FFF0F0', border: '1px solid #8B0000', color: '#8B0000' }}
                                        >
                                            <div>Too many failed logon attempts ({loginGuard.lockLabel || 'restricted'}).</div>
                                            <div className="font-mono">
                                                Try again in: {formatLockoutRemaining(loginGuard.lockedUntil - lockNow)}
                                            </div>
                                        </div>
                                    ) : loginError && (
                                        <div
                                            className="mb-3 px-3 py-2 text-xs font-bold"
                                            style={{ backgroundColor: '#FFF0F0', border: '1px solid #8B0000', color: '#8B0000' }}
                                        >
                                            {loginError}
                                        </div>
                                    )}

                                    <div className="space-y-3" style={isLoginLocked ? { opacity: 0.6 } : undefined}>
                                        <div>
                                            <label className="block text-[11px] font-bold mb-1">Editorial ID:</label>
                                            <input
                                                type="email"
                                                value={loginEmail}
                                                onChange={(e) => setLoginEmail(e.target.value)}
                                                placeholder="Editorial ID"
                                                autoComplete="username"
                                                className="w-full"
                                                style={sunkenInput}
                                                disabled={isLoginLocked}
                                                required
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-[11px] font-bold mb-1">Password:</label>
                                            <input
                                                type="password"
                                                value={loginPassword}
                                                onChange={(e) => setLoginPassword(e.target.value)}
                                                placeholder="Enter password"
                                                autoComplete="current-password"
                                                className="w-full"
                                                style={sunkenInput}
                                                disabled={isLoginLocked}
                                                required
                                            />
                                        </div>

                                        <label className="flex items-center gap-2 cursor-pointer select-none pt-1">
                                            <input
                                                type="checkbox"
                                                checked={rememberDevice}
                                                onChange={(e) => setRememberDevice(e.target.checked)}
                                                disabled={isLoginLocked}
                                                className="cursor-pointer"
                                            />
                                            <span className="text-xs">Remember this device for 7 days</span>
                                        </label>

                                        <div className="pt-2 flex flex-wrap items-center justify-between gap-2">
                                            <span className="text-[11px] font-medium" style={{ color: '#444444' }}>
                                                No login? Contact Support
                                            </span>
                                            <div className="flex items-center gap-2">
                                                <button type="button" onClick={onClose} style={bevelBtn}>
                                                    Cancel
                                                </button>
                                                <button type="submit" disabled={isLoginLocked || isLoggingIn} style={bevelBtnPrimary}>
                                                    {isLoggingIn ? 'Signing In...' : 'OK / Sign In'}

        const containerRef = React.useRef(null);
        const [indicatorStyle, setIndicatorStyle] = useState({ transform: 'translateX(0)', width: '0px', opacity: 0 });

        React.useLayoutEffect(() => {
            let mounted = true;
            let rafId = null;
            const updateIndicator = () => {
                if (!containerRef.current || !Array.isArray(categories) || !mounted) return;
                let activeEl = null;

                if (isMissions) {
                    activeEl = containerRef.current.querySelector('.tab-btn-missions');
                } else {
                    const buttons = containerRef.current.querySelectorAll('.tab-btn-cat');
                    const activeIdx = categories.findIndex(c => c && c.name === activeTab);
                    if (activeIdx !== -1 && buttons[activeIdx]) {
                        activeEl = buttons[activeIdx];
                    }
                }

                if (activeEl && containerRef.current) {
                    const left = activeEl.offsetLeft;
                    const width = activeEl.offsetWidth;
                    if (width > 0) {
                        setIndicatorStyle({
                            width: `${width}px`,
                            transform: `translateX(${left}px) translateZ(0)`,
                            opacity: 1
                        });
                    }
                }
            };

            if (indicatorStyle.opacity === 0 && containerRef.current) {
                const indicator = containerRef.current.querySelector('.category-indicator');
                if (indicator) indicator.style.transition = 'none';
                updateIndicator();
                if (indicator) {
                    indicator.offsetHeight;
                    indicator.style.transition = '';
                }
            } else {
                updateIndicator();
            }

            rafId = requestAnimationFrame(updateIndicator);
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => { if (mounted) updateIndicator(); }).catch(() => {});
            }

            let ro = null;
            if (typeof ResizeObserver !== 'undefined' && containerRef.current) {
                ro = new ResizeObserver(() => {
                    if (mounted) updateIndicator();
                });
                ro.observe(containerRef.current);
                containerRef.current.querySelectorAll('.tab-btn-cat, .tab-btn-missions').forEach(el => ro.observe(el));
            }

            window.addEventListener('resize', updateIndicator);
            return () => {
                mounted = false;
                if (rafId) cancelAnimationFrame(rafId);
                if (ro) ro.disconnect();
                window.removeEventListener('resize', updateIndicator);
            };
        }, [activeTab, categories, isMissions]);

        if (!Array.isArray(categories) || categories.length === 0) return null;

        return (
            <div className={`category-island-container ${className}`}>

    const getLaunchImageUrl = (launch) => {
        if (!launch) return 'https://images.unsplash.com/photo-1517976487502-5f79e924a0ed?auto=format&fit=crop&w=800&q=80';
        if (typeof launch.image === 'string' && launch.image.startsWith('http')) return launch.image;
        if (launch.image && typeof launch.image.image_url === 'string') return launch.image.image_url;
        if (launch.rocket?.configuration?.image_url) return launch.rocket.configuration.image_url;
        if (launch.rocket?.image_url) return launch.rocket.image_url;
        return 'https://images.unsplash.com/photo-1517976487502-5f79e924a0ed?auto=format&fit=crop&w=800&q=80';
    };

    const getLaunchStatus = (statusObj) => {
        if (!statusObj) return { label: 'TBD', colorClass: 'status-pill-tbd', beaconClass: '', type: 'tbd' };
        const name = (statusObj.name || statusObj.abbrev || '').toLowerCase();
        const id = statusObj.id;

        if (id === 1 || name.includes('go') || name.includes('success')) {
            return { label: 'GO FOR LAUNCH', colorClass: 'status-pill-go', beaconClass: '', type: 'go' };
        }
        if (id === 3 || name.includes('success')) {
            return { label: 'SUCCESS', colorClass: 'status-pill-success', beaconClass: '', type: 'success' };
        }
        if (id === 5 || id === 7 || name.includes('scrub') || name.includes('hold') || name.includes('fail')) {
            return { label: 'SCRUBBED', colorClass: 'status-pill-scrub', beaconClass: '', type: 'scrub' };
        }
        return { label: statusObj.abbrev || 'TBD', colorClass: 'status-pill-tbd', beaconClass: '', type: 'tbd' };
    };

    const getBoosterRecoveryPlan = (launch) => {
        if (!launch) return 'Telemetry Pending';
        const stages = launch.rocket?.launcher_stage || launch.launcher_stage;
        if (Array.isArray(stages) && stages.length > 0) {
            const landing = stages[0]?.landing;
            if (landing) {
                if (landing.attempt === false) return 'Expendable (No Recovery Attempt)';
                const typeName = landing.type?.name || landing.type?.abbrev || '';
                const locName = landing.location?.name || '';
                if (typeName.toLowerCase().includes('asds') || typeName.toLowerCase().includes('drone') || locName.toLowerCase().includes('asds')) {
                    return `Droneship Landing (${locName || 'Autonomous Spaceport Drone Ship'})`;
                }
                if (typeName.toLowerCase().includes('rtls') || typeName.toLowerCase().includes('return') || locName.toLowerCase().includes('landing zone')) {
                    return `Return to Launch Site (${locName || 'RTLS Ground Pad'})`;
                }
                if (typeName.toLowerCase().includes('catch') || locName.toLowerCase().includes('chopsticks') || locName.toLowerCase().includes('mechazilla')) {
                    return `Tower Catch (${locName || 'Mechazilla Robotic Chopsticks'})`;
                }
                if (landing.type?.name) return `${landing.type.name} (${locName || 'Designated Recovery Zone'})`;
            }
        }

        const vName = (launch.name || launch.rocket?.configuration?.name || '').toLowerCase();
        if (vName.includes('starship')) return 'Chopstick Tower Catch (Mechazilla)';
        if (vName.includes('falcon 9') || vName.includes('falcon heavy')) return 'Autonomous Spaceport Drone Ship (ASDS)';
        if (vName.includes('electron')) return 'Expendable / Ocean Splashdown';

    const calculateCountdown = (netStr) => {
        if (!netStr) return { isPast: false, days: 0, hours: 0, minutes: 0, seconds: 0, text: 'T-00:00:00' };
        const target = new Date(netStr).getTime();
        const now = Date.now();
        const diff = target - now;

        if (isNaN(target)) {
            return { isPast: false, days: 0, hours: 0, minutes: 0, seconds: 0, text: 'TBD' };
        }

        const isPast = diff < 0;
        const absDiff = Math.abs(diff);

        const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((absDiff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((absDiff / 1000 / 60) % 60);
        const seconds = Math.floor((absDiff / 1000) % 60);

        const pad = (n) => String(n).padStart(2, '0');
        const prefix = isPast ? 'T+' : 'T-';
        const text = `${prefix}${days > 0 ? `${days}d ` : ''}${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

        return { isPast, days, hours, minutes, seconds, text };
    };

                month: 'short',
                day: 'numeric',

        } catch (e) {

    const AI_CONFIG = {
