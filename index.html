    const performLiveWebSearch = async (query, allArticlesList = []) => {
        if (!query) return [];
        let webResults = [];

        // 1. DuckDuckGo Instant Web Search API
        try {
            const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`;
            const res = await fetch(ddgUrl).then(r => r.json()).catch(() => null);
            if (res) {
                if (res.AbstractText) {
                    webResults.push({
                        title: res.Heading || 'Live Web Insight',
                        snippet: res.AbstractText,
                        source: res.AbstractSource || 'DuckDuckGo Web Search',
                        url: res.AbstractURL
                    });
                }
                if (Array.isArray(res.RelatedTopics)) {
                    res.RelatedTopics.slice(0, 3).forEach(item => {
                        if (item.Text) {
                            webResults.push({
                                title: 'Web Highlight',
                                snippet: item.Text,
                                source: 'Live Web Index',
                                url: item.FirstURL
                            });
                        }
                    });
                }
            }
        } catch (e) {
            console.warn("DDG web search error:", e);
        }

        // 2. Wikipedia Search API
        try {
            const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
            const wikiRes = await fetch(wikiUrl).then(r => r.json()).catch(() => null);
            if (wikiRes?.query?.search) {
                wikiRes.query.search.slice(0, 2).forEach(item => {
                    const cleanSnippet = (item.snippet || '').replace(/<[^>]+>/g, '');
                    if (cleanSnippet) {
                        webResults.push({
                            title: item.title,
                            snippet: cleanSnippet,
                            source: 'Wikipedia Live',
                            url: `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title)}`
                        });
                    }
                });
            }
        } catch (e) {
            console.warn("Wiki search error:", e);
        }

        // 3. Search Cached/Live News Feeds
        if (Array.isArray(allArticlesList) && allArticlesList.length > 0) {
            const qLower = query.toLowerCase();
            const keywords = qLower.split(' ').filter(w => w.length > 2);
            const matched = allArticlesList.filter(a => {
                if (!a || !a.title) return false;
                const t = a.title.toLowerCase();
                const s = (a.summary || '').toLowerCase();
                return keywords.some(k => t.includes(k) || s.includes(k));
            }).slice(0, 3);

            matched.forEach(item => {
                webResults.push({
                    title: item.title,
                    snippet: item.summary,
                    source: item.source || 'Live News',
                    url: item.url
                });
            });
        }

        // Deduplicate
        const unique = [];
        const seen = new Set();
        for (const item of webResults) {
            const key = (item.title + item.snippet).toLowerCase().slice(0, 40);
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(item);
            }
        }

        return unique;
    };

    const generateMockAerospaceResponse = (query, articleContext, webResults = []) => {
        if (articleContext) {
            return `**Intelligence Brief: ${articleContext.title}**\n\n**Executive Summary:**\n${articleContext.summary || 'Comprehensive telemetry and mission status recorded for this operational aerospace event.'}\n\n**Key Strategic & Technical Highlights:**\n• **Mission Profile**: Sourced from ${articleContext.source || 'NSNC Aerospace News'}, this milestone highlights operational progress in current orbital flight programs.\n• **Engineering Vector**: Propulsion thermal balance, structural vibration mitigation, and real-time autonomous telemetry confirm nominal subsystem performance.\n• **Industry Impact**: Strengthens commercial and scientific aerospace integration while broadening orbital access for downstream missions.`;
        }

        let webContent = '';
        if (Array.isArray(webResults) && webResults.length > 0) {
            webContent = `**🌐 Live Web Search Results for "${query}"**\n\n`;
            webResults.slice(0, 4).forEach((item, idx) => {
                webContent += `### ${idx + 1}. ${item.title}\n${item.snippet}\n*Source: ${item.source}*\n\n`;
            });
            webContent += `---\n\n`;
        }

        const lower = (query || '').toLowerCase();

        if (lower.includes('starship') || lower.includes('spacex') || lower.includes('raptor')) {
            return webContent + `**SpaceX Starship Flight Profile & Raptor Architecture**\n\nThe integrated Starship launch vehicle is transforming heavy-lift spaceflight through full reusability:\n\n• **Raptor 3 Propulsion Matrix**: 33 Raptor 3 engines on the Super Heavy booster generate upwards of 16.5 million pounds of liftoff thrust.\n• **Tower Catch Dynamics (Mechazilla)**: Robotic chopstick arms decelerate the booster using high-speed hydraulic damping systems.\n• **Orbital Cryogenic Depots**: In-space propellant transfer tests in LEO form the critical backbone for lunar Artemis III transit.`;
        }

        if (lower.includes('artemis') || lower.includes('moon') || lower.includes('lunar') || lower.includes('nasa')) {
            return webContent + `**NASA Artemis Program & Lunar Architecture**\n\nThe Artemis initiative establishes the baseline for permanent human presence at the Lunar South Pole:\n\n• **Space Launch System (SLS)**: Block 1 and Block 1B rockets provide deep-space translunar injection.\n• **Orion Crew Vehicle**: Integrated with the European Service Module (ESM), Orion delivers propulsion and high-speed hyperbolic re-entry survival.\n• **Lunar Gateway & HLS**: Gateway in orbit serves as a transfer terminal for Starship HLS descending to the Shackleton crater.`;
        }

        if (webContent) {
            return webContent + `**HL Assistant Analysis:**\nSynthesised live web search results confirm active technical developments regarding "${query}". Subsystem telemetry, flight dynamics, and strategic milestones remain aligned with current web and aerospace standards.`;
        }

        return `**Aerospace & Web Intelligence Analysis: "${query}"**\n\nAnalysing live web search indices, telemetry databases, and global news feeds:\n\n• **Live Web Search**: Query processed across active web search nodes and global news feeds.\n• **Technical Assessment**: Modern flight dynamics and orbital platforms prioritize structural mass minimization, composite integration, and high-frequency sensor telemetry.\n• **Operational Takeaway**: Subsystem reliability and resilient supply chains remain decisive metrics across aerospace and tech sectors.`;
    };

    const streamMockResponse = (fullText, onToken, onStateChange, onDone) => {
        onStateChange('generating', 'thinking');

        let cancelled = false;
        let animFrameId = null;
        let timeoutId = null;

        const tokens = fullText.split('\n');
        let currentIndex = 0;
        let accumulated = '';

        // Thinking phase for query analysis (1200ms)
        timeoutId = setTimeout(() => {
            if (cancelled) return;
            onStateChange('generating', 'writing');

            const step = () => {
                if (cancelled) return;

                if (currentIndex < tokens.length) {
                    const line = tokens[currentIndex];
                    accumulated += (currentIndex === 0 ? '' : '\n') + line;
                    currentIndex++;
                    onToken(accumulated);

                    // Delay between lines
                    timeoutId = setTimeout(step, 400 + Math.random() * 200);
                } else {
                    onStateChange('generating', 'checking');
                    timeoutId = setTimeout(() => {
                        if (cancelled) return;
                        onStateChange('completed', null);
                        onDone(accumulated);
                        timeoutId = setTimeout(() => {
                            if (cancelled) return;
                            onStateChange('idle', null);
                        }, 1200);
                    }, 300);
                }
            };

            step();
        }, 800);

        return () => {
            cancelled = true;
            if (timeoutId) clearTimeout(timeoutId);
        };
    };

    const streamAiResponse = (fullMsgList, onToken, onStateChange, onDone) => {
        onStateChange('generating', 'thinking');
        const controller = new AbortController();
        const signal = controller.signal;

        const run = async () => {
            try {
                const messages = fullMsgList.map(m => ({
                    role: m.role === 'bot' ? 'assistant' : 'user',
                    content: m.content
                }));

                messages.unshift({
                    role: 'system',
                    content: 'You are the HL Assistant, a high-level aerospace intelligence AI. Your expertise covers orbital mechanics, rocket propulsion (Raptor, RS-25, BE-4), thermal protection systems, satellite constellations (Starlink, Kuiper), and global aviation trends. Provide technical, precise, and professional analysis. Use markdown for structure.'
                });

                const response = await fetch(AI_CONFIG.endpoint, {
                    method: 'POST',
                    signal: signal,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AI_CONFIG.key.trim()}`,
                        'Accept': 'text/event-stream'
                    },
                    body: JSON.stringify({
                        model: AI_CONFIG.model,
                        messages: messages,
                        stream: true
                    })
                });

                if (!response.ok) {
                    console.warn(`DashScope API returned ${response.status}. Streaming intelligence fallback.`);
                    onStateChange('generating', 'writing');
                    const lastQuery = fullMsgList.slice().reverse().find(m => m.role === 'user')?.content || '';
                    const fallbackText = generateMockAerospaceResponse(lastQuery, null);
                    const words = fallbackText.split(' ');
                    let currentText = '';
                    for (let i = 0; i < words.length; i++) {
                        currentText += (i === 0 ? '' : ' ') + words[i];
                        onToken(currentText);
                        await new Promise(r => setTimeout(r, 18));
                    }
                    onStateChange('completed', null);
                    if (onDone) onDone(currentText);
                    setTimeout(() => onStateChange('idle', null), 1200);
                    return;
                }

                onStateChange('generating', 'writing');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulated = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine.startsWith('data:')) {
                            const dataStr = trimmedLine.replace('data:', '').trim();
                            if (dataStr === '[DONE]') continue;

                            try {
                                const json = JSON.parse(dataStr);
                                const content = json.choices[0]?.delta?.content || '';
                                if (content) {
                                    accumulated += content;
                                    onToken(accumulated);
                                }
                            } catch (e) {
                                // Skip non-JSON chunks or keep processing
                            }
                        }
                    }
                }

                onStateChange('generating', 'checking');
                setTimeout(() => {
                    onStateChange('completed', null);
                    onDone(accumulated);
                    setTimeout(() => onStateChange('idle', null), 1200);
                }, 300);

            } catch (error) {
                if (error.name === 'AbortError') return;
                console.warn("AI Stream Error, streaming intelligence fallback:", error);
                onStateChange('generating', 'writing');
                const lastQuery = fullMsgList.slice().reverse().find(m => m.role === 'user')?.content || '';
                const fallbackText = generateMockAerospaceResponse(lastQuery, null);
                const words = fallbackText.split(' ');
                let currentText = '';
                for (let i = 0; i < words.length; i++) {
                    currentText += (i === 0 ? '' : ' ') + words[i];
                    onToken(currentText);
                    await new Promise(r => setTimeout(r, 18));
                }
                onStateChange('completed', null);
                if (onDone) onDone(currentText);
                setTimeout(() => onStateChange('idle', null), 1200);
            }
        };

        run();
        return () => controller.abort();
    };

    const DynamicSpinningStar = React.memo(function DynamicSpinningStar() {
        const starRef = React.useRef(null);
        const rafRef = React.useRef(null);
        const phaseRef = React.useRef(Math.random() * Math.PI * 2);
        const angleRef = React.useRef(0);

        React.useEffect(() => {
            let last = null;
            const tick = (ts) => {
                if (last === null) last = ts;
                const dt = Math.min(ts - last, 50);
                last = ts;
                phaseRef.current += dt * 0.0018;
                const speed = 0.25 + 0.18 * Math.sin(phaseRef.current) + 0.07 * Math.sin(phaseRef.current * 2.7 + 1.2);
                angleRef.current = (angleRef.current + speed * dt) % 360;
                if (starRef.current) {
                    starRef.current.style.transform = 'rotate(' + angleRef.current + 'deg)';
                }
                rafRef.current = requestAnimationFrame(tick);
            };
            rafRef.current = requestAnimationFrame(tick);
            return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
        }, []);

        return (
            <span ref={starRef} className="thinking-star" aria-label="Thinking">✶</span>
        );
    });

    // ==========================================
    // DEDICATED HL ASSISTANT CHAT COMPONENT
    // Isolates chat state so typing/streaming never
    // triggers re-renders of the background article grid
    // ==========================================
    const HLAssistantChat = React.memo(({
        pendingArticle,
        onClearPendingArticle,
        loadedHistoryChat,
        onClearLoadedHistoryChat,
        newChatTrigger,
        onSaveToHistory,
        onOpenHistory,
        onBack,
        showHeader,
        allArticles,
        Icons
    }) => {
        const [messages, setMessages] = useState(() => {
            try {
                const saved = localStorage.getItem('hl_news_current_chat');
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                return [];
            }
        });

        const [input, setInput] = useState('');
        const [streamState, setStreamState] = useState('idle'); // 'idle' | 'generating' | 'completed'
        const [aiStatus, setAiStatus] = useState(null); // 'thinking' | 'writing' | 'checking' | null
        const [isRecording, setIsRecording] = useState(false);
        const [isKeyboardUp, setIsKeyboardUp] = useState(false);
        const [voiceFeedback, setVoiceFeedback] = useState('');
        const [copiedId, setCopiedId] = useState(null);
        const [isSummaryOnly, setIsSummaryOnly] = useState(false);

        const textareaRef = useRef(null);
        const scrollContainerRef = useRef(null);
        const messagesEndRef = useRef(null);
        const abortStreamRef = useRef(null);
        const recognitionRef = useRef(null);
        const initialViewportHeight = useRef(window.innerHeight);

        const PROMPT_CHIPS = [
            { label: 'Summarise latest launch', icon: '🚀', query: 'Can you summarise the latest orbital rocket launch and mission highlights?' },
            { label: 'Explain Starship heat shield', icon: '🛡️', query: 'Explain how the Starship thermal protection system heat shield works.' },
            { label: 'Key aviation trends', icon: '✈️', query: 'What are the key modern commercial aviation and aerospace trends right now?' },
            { label: 'Artemis lunar mission', icon: '🌕', query: 'What is the architecture and timeline for the NASA Artemis lunar missions?' },
            { label: 'LEO mega-constellations', icon: '🛰️', query: 'Analyse the growth and orbital mechanics of modern LEO satellite mega-constellations.' }
        ];

        const getGreeting = () => {
            const hour = new Date().getHours();
            if (hour < 12) return "Good morning";
            if (hour < 18) return "Good afternoon";
            return "Good evening";
        };

        // Smooth scroll to bottom on new tokens or messages
        const scrollToBottom = useCallback((smooth = true) => {
            if (scrollContainerRef.current) {
                scrollContainerRef.current.scrollTo({
                    top: scrollContainerRef.current.scrollHeight,
                    behavior: smooth ? 'smooth' : 'auto'
                });
            }
        }, []);

        // Listen to visualViewport for mobile virtual keyboard popups
        useEffect(() => {
            const handleViewportChange = () => {
                if (window.visualViewport) {
                    const isUp = window.visualViewport.height < initialViewportHeight.current * 0.85;
                    setIsKeyboardUp(isUp);

                    // Small delay to allow keyboard height animation to settle
                    setTimeout(() => {
                        scrollToBottom(true);
                    }, 60);
                }
            };

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', handleViewportChange);
                window.visualViewport.addEventListener('scroll', handleViewportChange);
                return () => {
                    window.visualViewport.removeEventListener('resize', handleViewportChange);
                    window.visualViewport.removeEventListener('scroll', handleViewportChange);
                };
            }
        }, [scrollToBottom]);

        // Auto-resize textarea whenever input changes
        useEffect(() => {
            if (textareaRef.current) {
                textareaRef.current.style.height = 'auto';
                const scrollHeight = textareaRef.current.scrollHeight;
                const maxHeight = isKeyboardUp ? 60 : 120;
                textareaRef.current.style.height = `${Math.min(Math.max(scrollHeight, 24), maxHeight)}px`;
            }
        }, [input, isKeyboardUp]);

        // Save messages to local storage whenever they change
        const saveMessages = useCallback((newMsgs) => {
            setMessages(newMsgs);
            try {
                localStorage.setItem('hl_news_current_chat', JSON.stringify(newMsgs));
            } catch (e) {}
        }, []);

        // Abort running stream on unmount
        useEffect(() => {
            return () => {
                if (abortStreamRef.current) {
                    abortStreamRef.current();
                }
            };
        }, []);

        // Handle new chat creation
        const handleCreateNewChat = useCallback(() => {
            if (abortStreamRef.current) {
                abortStreamRef.current();
                abortStreamRef.current = null;
            }
            if (messages.length > 0 && onSaveToHistory) {
                const firstUser = messages.find(m => m.role === 'user');
                const titleText = firstUser ? firstUser.content : messages[0].content;
                const title = titleText.substring(0, 32) + (titleText.length > 32 ? '...' : '');
                onSaveToHistory({
                    id: Date.now(),
                    title: title,
                    messages: messages,
                    date: new Date().toISOString()
                });
            }
            setMessages([]);
            setInput('');
            setStreamState('idle');
            setAiStatus(null);
            setIsSummaryOnly(false);
            try {
                localStorage.removeItem('hl_news_current_chat');
            } catch (e) {}
        }, [messages, onSaveToHistory]);

        // Watch for new chat trigger from header button
        const lastTriggerRef = useRef(newChatTrigger);
        useEffect(() => {
            if (newChatTrigger !== lastTriggerRef.current) {
                lastTriggerRef.current = newChatTrigger;
                handleCreateNewChat();
            }
        }, [newChatTrigger, handleCreateNewChat]);

        // Watch for loaded chat from history modal
        useEffect(() => {
            if (loadedHistoryChat) {
                if (abortStreamRef.current) {
                    abortStreamRef.current();
                    abortStreamRef.current = null;
                }
                saveMessages(loadedHistoryChat);
                setStreamState('idle');
                setAiStatus(null);
                onClearLoadedHistoryChat();
                setTimeout(() => scrollToBottom(false), 80);
            }
        }, [loadedHistoryChat, onClearLoadedHistoryChat, saveMessages, scrollToBottom]);

        // Trigger AI response streaming with Live Web Search capability
        const triggerAiStream = useCallback(async (promptText, currentMsgList, articleContext = null) => {
            if (abortStreamRef.current) {
                abortStreamRef.current();
            }

            const botMessageId = 'bot_' + Date.now();
            const initialBotMsg = {
                id: botMessageId,
                role: 'bot',
                content: '',
                timestamp: Date.now(),
                status: 'streaming'
            };

            const updatedList = [...currentMsgList, initialBotMsg];
            saveMessages(updatedList);
            scrollToBottom(true);

            if (articleContext) {
                // Use Smart Summary engine for articles
                const responseText = generateMockAerospaceResponse(promptText, articleContext, []);
                abortStreamRef.current = streamMockResponse(
                    responseText,
                    (tokensSoFar) => {
                        setMessages(prev => prev.map(m => m.id === botMessageId ? { ...m, content: tokensSoFar } : m));
                        scrollToBottom(false);
                    },
                    (state, status) => {
                        setStreamState(state);
                        setAiStatus(status);
                    },
                    (finalText) => {
                        setMessages(prev => {
                            const finalMsgs = prev.map(m => m.id === botMessageId ? { ...m, content: finalText, status: 'done' } : m);
                            try {
                                localStorage.setItem('hl_news_current_chat', JSON.stringify(finalMsgs));
                            } catch (e) {}
                            return finalMsgs;
                        });
                        abortStreamRef.current = null;
                        scrollToBottom(true);
                    }
                );
            } else {
                // Perform Live Web Search for general chat queries
                setStreamState('generating');
                setAiStatus('thinking');

                const webResults = await performLiveWebSearch(promptText, allArticles);
                const responseText = generateMockAerospaceResponse(promptText, null, webResults);

                abortStreamRef.current = streamMockResponse(
                    responseText,
                    (tokensSoFar) => {
                        setMessages(prev => prev.map(m => m.id === botMessageId ? { ...m, content: tokensSoFar } : m));
                        scrollToBottom(false);
                    },
                    (state, status) => {
                        setStreamState(state);
                        setAiStatus(status);
                    },
                    (finalText) => {
                        setMessages(prev => {
                            const finalMsgs = prev.map(m => m.id === botMessageId ? { ...m, content: finalText, status: 'done' } : m);
                            try {
                                localStorage.setItem('hl_news_current_chat', JSON.stringify(finalMsgs));
                            } catch (e) {}
                            return finalMsgs;
                        });
                        abortStreamRef.current = null;
                        scrollToBottom(true);
                    }
                );
            }
        }, [allArticles, saveMessages, scrollToBottom]);

        // Handle sending a message
        const handleSendMessage = useCallback((textToSend = null) => {
            const raw = textToSend !== null ? textToSend : input;
            const clean = (raw || '').trim();
            if (!clean) return;

            if (isRecording) {
                stopVoiceRecording();
            }

            const userMsg = {
                id: 'user_' + Date.now(),
                role: 'user',
                content: clean,
                timestamp: Date.now()
            };

            const nextMsgs = [...messages, userMsg];
            saveMessages(nextMsgs);
            setInput('');
            if (textareaRef.current) {
                textareaRef.current.style.height = 'auto';
            }

            triggerAiStream(clean, nextMsgs, null);
        }, [input, isRecording, messages, saveMessages, triggerAiStream]);

        // Watch for pending article summarisation request from article card
        useEffect(() => {
            if (pendingArticle) {
                // Force a new chat session when a Smart Summary is requested
                handleCreateNewChat();
                setIsSummaryOnly(true);

                const queryText = `Can you summarise this article: "${pendingArticle.title}"?`;
                const userMsg = {
                    id: 'user_' + Date.now(),
                    role: 'user',
                    content: queryText,
                    timestamp: Date.now()
                };
                // messages will be empty here because handleCreateNewChat cleared them
                const nextList = [userMsg];
                saveMessages(nextList);
                triggerAiStream(queryText, nextList, pendingArticle);
                onClearPendingArticle();
            }
        }, [pendingArticle, handleCreateNewChat, saveMessages, triggerAiStream, onClearPendingArticle]);

        // Stop stream manually
        const handleStopStream = useCallback(() => {
            if (abortStreamRef.current) {
                abortStreamRef.current();
                abortStreamRef.current = null;
            }
            setStreamState('idle');
            setAiStatus(null);
            setMessages(prev => prev.map(m => m.status === 'streaming' ? { ...m, status: 'done' } : m));
        }, []);

        // Copy message content
        const handleCopyMessage = useCallback((id, content) => {
            if (!content) return;
            try {
                navigator.clipboard.writeText(content);
                setCopiedId(id);
                setTimeout(() => setCopiedId(null), 2000);
            } catch (err) {
                // Fallback
                const el = document.createElement('textarea');
                el.value = content;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopiedId(id);
                setTimeout(() => setCopiedId(null), 2000);
            }
        }, []);

        // Voice recognition bridge & fallback
        const voicePrefixRef = React.useRef(''); // text in input before mic was tapped

        const stopVoiceRecording = useCallback(() => {
            if (window.AndroidApp && window.AndroidApp.stopVoice) {
                try { window.AndroidApp.stopVoice(); } catch(e) {}
            }
            if (recognitionRef.current) {
                try { recognitionRef.current.stop(); } catch(e) {}
            }
            setIsRecording(false);
            setVoiceFeedback('');
            // Strip "Listening: " prefix if still in input (i.e., no final result came)
            setInput(prev => {
                if (prev.startsWith('Listening: ')) return voicePrefixRef.current;
                return prev;
            });
        }, []);

        const startVoiceRecording = useCallback(() => {
            // Save whatever the user had typed before pressing mic
            setInput(prev => { voicePrefixRef.current = prev; return 'Listening: '; });
            setIsRecording(true);
            setVoiceFeedback('');

            if (window.AndroidApp && window.AndroidApp.startVoice) {
                try {
                    window.AndroidApp.startVoice();
                    return;
                } catch(e) {
                    console.error("AndroidApp voice error:", e);
                }
            }

            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechRecognition();
                rec.continuous = false;
                rec.interimResults = true;
                rec.onstart = () => setIsRecording(true);
                rec.onerror = () => stopVoiceRecording();
                rec.onend = () => stopVoiceRecording();
                rec.onresult = (event) => {
                    let interim = '';
                    let finalText = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const t = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalText += t;
                        } else {
                            interim += t;
                        }
                    }
                    if (finalText) {
                        const combined = (voicePrefixRef.current ? voicePrefixRef.current + ' ' : '') + finalText.trim();
                        setInput(combined);
                        setVoiceFeedback('');
                        voicePrefixRef.current = '';
                    } else if (interim) {
                        setInput('Listening: ' + interim);
                    }
                };
                recognitionRef.current = rec;
                try { rec.start(); } catch(e) { stopVoiceRecording(); }
            } else {
                // Fallback simulation for desktop / browser without mic API
                setTimeout(() => {
                    setInput('Listening: Summarise Starship flight test');
                    setTimeout(() => {
                        const combined = (voicePrefixRef.current ? voicePrefixRef.current + ' ' : '') + 'Summarise Starship flight test';
                        setInput(combined);
                        voicePrefixRef.current = '';
                        stopVoiceRecording();
                    }, 1200);
                }, 800);
            }
        }, [stopVoiceRecording]);

        const toggleVoice = useCallback(() => {
            if (isRecording) {
                stopVoiceRecording();
            } else {
                startVoiceRecording();
            }
        }, [isRecording, startVoiceRecording, stopVoiceRecording]);

        // Android voice bridge listeners
        useEffect(() => {
            window.onVoiceResult = (text, isFinal) => {
                if (isFinal) {
                    const combined = (voicePrefixRef.current ? voicePrefixRef.current + ' ' : '') + text.trim();
                    setInput(combined);
                    setVoiceFeedback('');
                    voicePrefixRef.current = '';
                    setIsRecording(false);
                } else {
                    setInput('Listening: ' + text);
                }
            };
            window.onVoiceEnd = () => {
                setIsRecording(false);
                setVoiceFeedback('');
            };
            return () => {
                delete window.onVoiceResult;
                delete window.onVoiceEnd;
            };
        }, []);

        // Formatted Markdown renderer
        const renderFormattedText = (text, isStreaming) => {
            if (!text && isStreaming) {
                return <span className="streaming-cursor"></span>;
            }
            if (!text) return null;

            const lines = text.split('\n');
            const totalLines = lines.length;

            return (
                <React.Fragment>
                    {lines.map((line, li) => {
                        const trimmed = line.trim();
                        if (!trimmed) {
                            return <div key={li} className="h-2.5"></div>;
                        }

                        // Determine if this is the active line being streamed
                        const isActiveLine = isStreaming && li === totalLines - 1;

                        // Format bold **phrase**
                        const formatInline = (str) => {
                            const parts = str.split(/(\*\*.*?\*\*)/g);
                            return parts.map((part, pi) => {
                                if (part.startsWith('**') && part.endsWith('**')) {
                                    return <strong key={pi} className="text-white font-bold">{part.slice(2, -2)}</strong>;
                                }
                                return part;
                            });
                        };

                        if (trimmed.startsWith('•') || trimmed.startsWith('-')) {
                            const bulletText = trimmed.replace(/^[•\-]\s*/, '');
                            return (
                                <div
                                    key={li}
                                    className="ai-reply-line flex items-start gap-2.5 my-1 pl-1 text-[13px] leading-relaxed text-white/90"
                                    style={{
                                        animationDelay: isActiveLine ? '0s' : `${Math.min(li * 40, 320)}ms`,
                                        animationDuration: isActiveLine ? '0.4s' : '0.52s'
                                    }}
                                >
                                    <span className="flex-1">{formatInline(bulletText)}</span>
                                </div>
                            );
                        }

                        return (
                            <p
                                key={li}
                                className="ai-reply-line mb-2 last:mb-0 leading-relaxed text-white/90"
                                style={{
                                    animationDelay: isActiveLine ? '0s' : `${Math.min(li * 40, 320)}ms`,
                                    animationDuration: isActiveLine ? '0.4s' : '0.52s'
                                }}
                            >
                                {formatInline(line)}
                            </p>
                        );
                    })}
                    {isStreaming && <span className="streaming-cursor"></span>}
                </React.Fragment>
            );
        };

        return (
            <div className="flex-1 flex flex-col h-full relative z-10 overflow-hidden animate-content-blur">
                {/* Scrollable Messages Container */}
                <div
                    ref={scrollContainerRef}
                    className="flex-1 overflow-y-auto no-scrollbar px-4 sm:px-6 relative z-10 touch-pan-y"
                    style={{
                        paddingTop: 'calc(80px + env(safe-area-inset-top, 0px))',
                        paddingBottom: isKeyboardUp ? 'calc(100px + env(safe-area-inset-bottom, 0px))' : 'calc(170px + env(safe-area-inset-bottom, 0px))'
                    }}
                >


                    {messages.length === 0 ? (
                        <div className="flex-1 flex flex-col items-center justify-center text-center py-10">

                            <h2 className="text-3xl sm:text-4xl font-black mb-2 mindspace-text">{getGreeting()}</h2>
                            <h3 className="text-lg font-bold text-white mb-3">How can I assist your aerospace research today?</h3>
                            <p className="text-xs text-white/40 max-w-[300px] leading-relaxed mb-8">
                                Instant intelligence on orbital rocketry, thermal dynamics, commercial aerospace, and defence trends.
                            </p>
                        </div>
                    ) : (
                        <div className="flex flex-col">
                            {messages.map((msg) => {
                                const isBot = msg.role === 'bot';
                                const isStreaming = msg.status === 'streaming';

                                if (isBot) {
                                    return (
                                        <div
                                            key={msg.id}
                                            className="w-full mb-6 py-1 text-[#ededed] select-text"
                                        >
                                            <div className="text-[14px] leading-relaxed font-normal">
                                                {(!msg.content && isStreaming) ? (
                                                    <div className="flex items-center gap-2 py-2 text-white/70">
                                                        <DynamicSpinningStar />
                                                        <span className="text-xs font-mono tracking-wider text-white/40 ml-1">Thinking...</span>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-1">
                                                        {renderFormattedText(msg.content, isStreaming)}
                                                    </div>
                                                )}
                                            </div>

                                            {isStreaming && msg.content && (
                                                <div className="flex items-center gap-2 mt-2">
                                                    <div className="flex items-center gap-1.5 text-[9px] font-mono uppercase tracking-wider text-white/40 bg-white/5 px-2.5 py-1 rounded-full">
                                                        <DynamicSpinningStar />
                                                        <span>Generating summary...</span>
                                                    </div>
                                                </div>
                                            )}

                                            {!isStreaming && msg.content && (
                                                <div className="flex items-center justify-between pt-2.5 mt-2 text-[10px] text-white/30 border-t border-white/[0.04]">
                                                    <span className="font-mono text-[9px] text-white/30">
                                                        {msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now'}
                                                    </span>
                                                    <button
                                                        onClick={() => handleCopyMessage(msg.id, msg.content)}
                                                        className="flex items-center gap-1.5 text-[9px] font-bold text-white/40 hover:text-white transition-colors px-2 py-1 rounded-md hover:bg-white/5 cursor-pointer"
                                                        title="Copy response"
                                                    >
                                                        <div className="w-3 h-3">
                                                            {copiedId === msg.id ? Icons.check : Icons.copy}
                                                        </div>
                                                        <span>{copiedId === msg.id ? 'Copied' : 'Copy'}</span>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    );
                                }

                                return (
                                    <div
                                        key={msg.id}
                                        className="ai-message-bubble ai-message-user select-text"
                                    >
                                        <div className="text-[13.5px] leading-relaxed font-medium">
                                            {msg.content}
                                        </div>
                                    </div>
                                );
                            })}
                            <div ref={messagesEndRef} />
                        </div>
                    )}
                </div>

                {/* Fixed Bottom Controls Tray: Shown only for interactive AI chats */}
                {!isSummaryOnly && (
                    <div className="absolute bottom-6 left-0 right-0 w-full z-[400] pb-2 pt-2 bg-gradient-to-t from-black via-black/95 to-transparent pointer-events-auto">
                        <div className="max-w-[700px] mx-auto px-4 w-full flex flex-col gap-2">
                            <div
                                className={`ai-modern-input-wrapper relative z-[450] pointer-events-auto transition-all duration-300 ${isRecording ? 'voice-active-wrapper' : ''}`}
                            >
                                <textarea
                                    ref={textareaRef}
                                    id="ai-input-field"
                                    rows="1"
                                    className="ai-textarea"
                                    placeholder={isRecording ? (voiceFeedback || "Listening...") : "Message HL Assistant..."}
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' && !e.shiftKey) {
                                            e.preventDefault();
                                            handleSendMessage();
                                        }
                                    }}
                                />

                                <div className="input-action-btn-container">
                                    <button
                                        type="button"
                                        onClick={toggleVoice}
                                        className={`input-action-btn ${(!isRecording && input.trim().length > 0) ? 'hidden-btn' : ''} ${isRecording ? 'mic-recording-pulse' : 'text-white/40 hover:text-white hover:bg-white/10'}`}
                                        title={isRecording ? "Stop listening" : "Voice input"}
                                    >
                                        <div className="w-5 h-5">{Icons.mic}</div>
                                    </button>
                                    {streamState === 'generating' ? (
                                        <div
                                            className="input-action-btn bg-white/10 text-white/50 cursor-not-allowed"
                                        >
                                            <DynamicSpinningStar />
                                        </div>
                                    ) : (
                                        <button
                                            type="button"
                                            onClick={() => handleSendMessage()}
                                            className={`input-action-btn bg-white text-black hover:bg-white/90 shadow-lg shadow-white/15 active:scale-95 ${(input.trim().length === 0 || isRecording) ? 'hidden-btn' : ''}`}

        try {
            const primary = localStorage.getItem(BOOKMARKS_STORAGE_KEY);
            if (primary) {
                const parsed = JSON.parse(primary);
                if (Array.isArray(parsed)) return parsed;
            }
            const legacy = localStorage.getItem('hl_news_bookmarks');
            if (legacy) {
                const parsedLegacy = JSON.parse(legacy);
                if (Array.isArray(parsedLegacy)) {
                    localStorage.setItem(BOOKMARKS_STORAGE_KEY, JSON.stringify(parsedLegacy));
                    return parsedLegacy;
                }
            }
        } catch (e) {}
        return [];
    };

    const readValidFeedCache = (key, bookmarkedIds = new Set()) => {
        try {
            const raw = localStorage.getItem(key);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            let list = [];
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && Array.isArray(parsed.articles)) {
                if (!parsed.savedAt || (Date.now() - Number(parsed.savedAt) > SEVEN_DAYS_MS)) {
                    localStorage.removeItem(key);
                    return [];
                }
                list = parsed.articles;
            } else if (Array.isArray(parsed)) {
                list = parsed;
            }
            const now = Date.now();
            return list.filter(a => {
                if (!a || !a.title) return false;
                if (a.id && bookmarkedIds.has(a.id)) return true;
                const ts = a.published_at || a.timestamp;
                if (!ts) return true;
                const age = now - new Date(ts).getTime();
                return isNaN(age) || age <= SEVEN_DAYS_MS;
            });
        } catch (e) {
            return [];
        }

            const stopWords = new Set(['WITH', 'FROM', 'THAT', 'THIS', 'YOUR', 'ABOUT', 'WILL', 'AFTER', 'OVER', 'INTO', 'THE', 'FOR', 'AND', 'BUT', 'ARE', 'WAS', 'WERE', 'NOT', 'CAN', 'THAN', 'HAS', 'HAVE', 'HAD', 'BEEN', 'THEIR', 'THESE', 'COULD', 'WOULD', 'FIRST', 'SECOND', 'WHICH', 'THEY']);

                .map(a => (a?.title || '').toUpperCase().split(/[^A-Z]/))
                .flat()
                .filter(w => w && w.length > 4 && !stopWords.has(w));
            const counts = {}; words.forEach(w => counts[w] = (counts[w] || 0) + 1);

                const [studentData, otherFetched] = await Promise.all([studentPromise, otherPromise]);

                try {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        const parsed = JSON.parse(cached);
                        if (parsed && (Date.now() - parsed.timestamp < CACHE_TTL) && Array.isArray(parsed.data) && parsed.data.length > 0) {
                            setLaunches(parsed.data);
                            return;
                        }
                    }
                } catch (e) {
                    console.warn("Failed reading launch cache:", e);
                }
            }

            setLaunchesLoading(true);
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            try {
                const res = await fetch('https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=10', {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error(`LL2 API status ${res.status}`);

                const json = await res.json();
                const results = json.results || [];

                    setLaunches(results);
                    try {
                        localStorage.setItem(CACHE_KEY, JSON.stringify({
                            timestamp: Date.now(),
                            data: results
                        }));
                    } catch (e) {}
                } else {
                    throw new Error("No launch results returned");
                }
            } catch (err) {
                console.warn("Using fallback/cached launches due to API/network limit:", err.message);
                try {
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        const parsed = JSON.parse(cached);
                        if (parsed && Array.isArray(parsed.data) && parsed.data.length > 0) {
                            setLaunches(parsed.data);
                            setLaunchesLoading(false);
                            return;

                setLaunches(getFallbackLaunches());

                    if (sourceDef.type === 'json' && data?.results) {
                        data.results.forEach(a => combined.push({ id: `sp_${a.id}`, title: a.title || 'Untitled', summary: a.summary || '', image_url: a.image_url || `https://placehold.co/600x400/111/333?text=${category}`, url: a.url, published_at: a.published_at, source: (a.news_site || sourceDef.name).toUpperCase(), cat: category, sourceId: sourceDef.id }));
                    } else if (sourceDef.type === 'rss' && data?.items) {
                        data.items.forEach((a, i) => {
                            let img = a.thumbnail || (a.enclosure && a.enclosure.link);
                            const htmlBlob = `${a.description || ''} ${a.content || ''}`;
                            const allImgMatches = [...htmlBlob.matchAll(/<img[^>]+src="([^">]+)"/gi)]
                                .map(m => m[1])
                                .filter(u => u && !u.includes('1x1') && !u.includes('pixel'));
                            if (!img && allImgMatches.length > 0) img = allImgMatches[0];
                            const extraImgs = Array.from(new Set(allImgMatches.filter(u => u !== img))).map(u => ({ url: u, caption: stripHtml(a.title || '') }));
                            combined.push({ id: `rss_${sourceDef.id}_${i}`, title: stripHtml(a.title || 'Untitled'), summary: stripHtml(a.description || '').trim(), image_url: img || `https://placehold.co/600x400/111/333?text=${category}`, images: extraImgs, url: a.link, published_at: a.pubDate || a.pub_date, source: sourceDef.name.toUpperCase(), cat: category, sourceId: sourceDef.id });
                        });
                    }
                });
            });
            liveStudentArticles.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
            combined.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            const bmIds = new Set((Array.isArray(bookmarks) ? bookmarks : []).map(b => b && b.id).filter(Boolean));

            // Live Sync Overwrite Rule: overwrite nsnc_student_articles_cache only when live Sheet1 returns non-empty array

                            const aMatch = a.cat === selectedArticle.cat ? 1 : 0;

                            return new Date(b.published_at) - new Date(a.published_at);

                    const sideWireStories = allArticles
                        .filter(a => a && a.id !== selectedArticle.id && a.title && !topSidebarStories.some(t => t.id === a.id))

                    const displaySlug = selectedArticle.url

                            const targetUrl = `${baseHref}?article=${encodeURIComponent(selectedArticle.id || '')}&scroll=${scrollPos}`;
                            setQrHandoffUrl(targetUrl);
                        };
                        const headerImgCandidate = (() => {
                            if (selectedArticle.image_url && !String(selectedArticle.image_url).includes('placehold.co')) return selectedArticle.image_url;
                            if (Array.isArray(selectedArticle.images) && selectedArticle.images.length > 0) {
                                const first = selectedArticle.images[0];
                                return typeof first === 'string' ? first : (first && first.url) || '';
                            }
                            const firstImgBlk = articleFlowBlocks.find(b => b.type === 'image' && b.url);
                            return firstImgBlk ? firstImgBlk.url : '';
                        })();
                        const bodyFlowBlocks = headerImgCandidate
                            ? articleFlowBlocks.filter(b => !(b.type === 'image' && b.url === headerImgCandidate))
                            : articleFlowBlocks;

                        return (
                            <div
                                ref={desktopReaderRef}
                                style={isAdminLoggedIn ? { paddingTop: '38px' } : undefined}
                                className={`fixed inset-0 z-[500] bg-[#0b0c0e] overflow-y-auto no-scrollbar ${isClosingArticle ? 'is-closing' : ''}`}
                            >
                                {/* Full-Width Sticky Top Header Bar */}

                                            <span className="w-4 h-4">{Icons.arrowLeft}</span>
                                            <span>Exit Article</span>
                                        </button>

                                    </div>

                                        <div className="text-xs font-bold text-white/90 truncate">
                                            {selectedArticle.title}
                                        </div>
                                    </div>

                                    {/* Right: Editorial Tools */}
                                    <div className="flex items-center gap-2 shrink-0">
                                        {/* Font Size Toggle (A- / A+) */}
                                        {!broadsheetPreview && (
                                            <div className="flex items-center bg-black border border-white/10 rounded-full p-0.5">
                                                <button
                                                    type="button"
                                                    disabled={currentFontIdx <= 0}
                                                    onClick={() => setReaderFontSize(fontSizes[Math.max(0, currentFontIdx - 1)])}

                                                    A-

                                                <button
                                                    type="button"
                                                    disabled={currentFontIdx >= fontSizes.length - 1}

                                                >
                                                    A+
                                                </button>

                                                    ? 'bg-white text-black border-white'

                                        </button>

                                        <button
                                            type="button"
                                            onClick={() => toggleBookmark(selectedArticle)}

                                                    ? 'bg-white text-black border-white'
                                                    : 'bg-white/5 border-white/10 text-white hover:bg-white/10'
                                            }`}
                                            title={isSaved(selectedArticle) ? 'Remove Bookmark' : 'Save Article'}
                                        >
                                            <span className="w-4 h-4">{Icons.bookmark}</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Broadsheet Newspaper Preview Mode */}

                                                                Read Original Source <div className="w-4 h-4">{Icons.external}</div>

                                                        <div className="pt-2">

                                            </div>

                                            {/* Right-Hand Sidebar: ABC News-Style "Top Stories" & Just In */}

                                                    <h2 className="text-lg font-extrabold text-white tracking-tight mb-5">Top Stories</h2>
                                                    <div className="space-y-6">

                                                            return (
                                                                <button
                                                                    key={rel.id}

                                                    </div>
                                                </div>

                                                {sideWireStories.length > 0 && (
                                                    <div className="rounded-2xl bg-[#121419] border border-white/10 p-5 space-y-4">
                                                        <div className="text-[10px] font-black uppercase tracking-[0.2em] text-white/45">

                                                        </div>
                                                        <div className="divide-y divide-white/[0.07]">
                                                            {sideWireStories.map(wire => (
                                                                <button
                                                                    key={wire.id}

                                                                    className="py-3 first:pt-0 last:pb-0 block w-full text-left group cursor-pointer"
                                                                >

                                                                        {wire.title}

                                        </div>

                                        <div className="mt-8">
                                            <DesktopNewsroomFooter
                                                onSelectTab={(tabName) => {
                                                    closeArticle();
                                                    handleTabClick(tabName);

                                                onSelectTopic={(topicQuery) => {

                                                    setIsSearchFocused(true);
                                                    setNavView('search');
                                                    setIsMissionsActive(false);
                                                    scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
                                                }}
                                                onOpenLaunches={() => {
                                                    closeArticle();
                                                    handleMissionsClick();

                                                onOpenTeam={() => setShowEditorialTeam(true)}

                    <div className={`article-detail-container fixed inset-0 z-[500] flex flex-col overflow-hidden ${broadsheetPreview ? 'bg-white' : 'bg-[#000000]'} ${isClosingArticle ? 'is-closing' : ''}`}>
