                                                <button type="button" onClick={() => { setMoreMenuOpen(false); setShowTermsModal(true); }} className="text-sm text-white/75 hover:text-white transition-colors cursor-pointer">Terms of Service</button>
                                                <button type="button" onClick={() => { setMoreMenuOpen(false); setNavView('saved'); setIsMissionsActive(false); scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); }} className="text-sm text-white/75 hover:text-white transition-colors cursor-pointer">Saved Articles ({bookmarks.length})</button>
                                                <button type="button" onClick={() => window.location.reload()} className="text-sm text-white/75 hover:text-white transition-colors cursor-pointer">Refresh Feeds</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                </div>
                            </div>
                        )}
                    </div>
                )}
                {!selectedArticle && !selectedLaunch && !modalView && <div className={`top-edge-blur ${!showHeader ? 'visible' : ''}`}></div>}

                {navView === 'ai' ? (
                    <HLAssistantChat
                        pendingArticle={activeArticleForChat}
                        onClearPendingArticle={() => setActiveArticleForChat(null)}
                        loadedHistoryChat={loadedHistoryChat}
                        onClearLoadedHistoryChat={() => setLoadedHistoryChat(null)}
                        newChatTrigger={newChatTrigger}
                        onSaveToHistory={(newChat) => {
                            const updated = [newChat, ...chatHistory].slice(0, 20);
                            setChatHistory(updated);
                            try {
                                localStorage.setItem('hl_news_chat_history', JSON.stringify(updated));
                            } catch (e) {}
                        }}
                        onOpenHistory={() => setModalView('chat_history')}
                        onBack={() => setNavView('home')}
                        showHeader={showHeader}
                        allArticles={allArticles}
                        Icons={Icons}
                    />
                ) : (
                    <div ref={scrollRef} className={`flex-1 overflow-y-auto no-scrollbar px-4 sm:px-6 relative z-10 touch-pan-y content-area-landscape-adjust ${contentReady ? 'blur-entry ready' : 'blur-entry'}`} style={{ paddingTop: `calc(${isAdminLoggedIn ? 208 : 170}px + env(safe-area-inset-top, 0px))`, paddingBottom: 'calc(110px + env(safe-area-inset-bottom, 0px))' }}>
                        {navView === 'search' && isDesktopAspect ? (
                            <DesktopSearchResultsPage
                                query={searchQuery}
                                onQueryChange={setSearchQuery}
                                allArticles={allArticles}
                                onSelectArticle={selectArticle}
                                onCloseSearch={() => {
                                    setSearchQuery('');
                                    setIsSearchFocused(false);
                                    setNavView('home');
                                }}
                                Icons={Icons}
                            />
                        ) : navView === 'about' ? (
                            <AboutView
                                onExternalLink={handleExternalLink}
                                onOpenProjects={() => {
                                    setNavView('home');
                                    setIsMissionsActive(false);
                                    scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
                                }}
                                Icons={Icons}
                            />
                        ) : isMissionsActive ? (
                            /* ORBITAL MISSIONS VIEW: Same tile shape as aerospace news, adapting to layoutMode */
                            <div key={`missions_${refreshKey}_${layoutMode}`} className={`pt-2 articles-grid layout-${layoutMode}`}>
                                {launchesLoading ? (
                                    [1,2,3,4,5,6].map(i => (
                                        <div key={i} className={`article-card layout-${layoutMode} p-4`}>
                                            <div className="w-full aspect-[16/10] rounded-2xl skeleton-dark mb-4" />
                                            <div className="w-2/3 h-4 rounded-full skeleton-dark mb-2" />
                                            <div className="w-1/3 h-3 rounded-full skeleton-dark" />
                                        </div>
                                    ))
                                ) : (
                                    (launches && launches.length > 0 ? launches : getFallbackLaunches()).map((launch, index) => (
                                        <MissionCard
                                            key={launch.id || index}
                                            launch={launch}
                                            index={index}
                                            layoutMode={layoutMode}
                                            onSelect={handleSelectLaunch}
                                            Icons={Icons}
                                        />
                                    ))
                                )}
                            </div>
                        ) : loading ? (
                            <div className="w-full max-w-[1600px] mx-auto pt-2 space-y-6 animate-content-blur">
                                {/* Live Feed Sync Status Bar */}
                                <div className="rounded-[22px] bg-[#0a0b0e]/90 backdrop-blur-2xl border border-white/15 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-[inset_0_1px_0_rgba(255,255,255,0.1)]">
                                    <div className="flex items-center gap-3.5">
                                        <span className="relative flex h-3 w-3 shrink-0">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75" />
                                            <span className="relative inline-flex rounded-full h-3 w-3 bg-sky-400" />
                                        </span>
                                        <div>
                                            <div className="text-xs font-black uppercase tracking-[0.2em] text-white">
                                                Synchronizing NSNC Newsroom
                                            </div>
                                            <div className="text-[11px] text-white/55 mt-0.5">
                                                Fetching Student News CMS, Australian &amp; Global News, Weather &amp; Aerospace Telemetry...
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        {['Student CMS', 'AU & Global', 'Aerospace', 'RFS & Weather'].map(tag => (
                                            <span
                                                key={tag}
                                                className="px-2.5 py-1 rounded-full bg-white/[0.06] border border-white/10 text-[9px] font-bold uppercase tracking-wider text-white/70"
                                            >
                                                {tag}
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                {/* Editorial Hero + Right Sidebar Skeleton */}
                                <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_380px] gap-8 items-start">
                                    <div className="space-y-6">
                                        <div className="rounded-[22px] bg-[#0a0b0e] border border-white/10 overflow-hidden grid grid-cols-1 md:grid-cols-12">
                                            <div className="md:col-span-6 h-64 md:h-80 skeleton-dark" />
                                            <div className="md:col-span-6 p-6 space-y-4 flex flex-col justify-between">
                                                <div className="space-y-3">
                                                    <div className="flex gap-2">
                                                        <div className="h-5 w-24 rounded-full skeleton-dark" />
                                                        <div className="h-5 w-16 rounded-full skeleton-dark" />
                                                    </div>
                                                    <div className="h-7 w-11/12 rounded-xl skeleton-dark" />
                                                    <div className="h-7 w-3/4 rounded-xl skeleton-dark" />
                                                    <div className="h-4 w-full rounded-lg skeleton-dark mt-2" />
                                                    <div className="h-4 w-5/6 rounded-lg skeleton-dark" />
                                                </div>
                                                <div className="h-4 w-1/3 rounded-lg skeleton-dark" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {[1, 2, 3, 4, 5, 6].map(i => (
                                                <div
                                                    key={i}
                                                    className="rounded-[22px] bg-[#0a0b0e] border border-white/10 overflow-hidden p-4 space-y-3"
                                                    style={{ animationDelay: `${i * 80}ms` }}
                                                >
                                                    <div className="h-36 w-full rounded-[14px] skeleton-dark" />
                                                    <div className="h-4 w-20 rounded-full skeleton-dark" />
                                                    <div className="h-5 w-full rounded-lg skeleton-dark" />
                                                    <div className="h-5 w-2/3 rounded-lg skeleton-dark" />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="hidden lg:block rounded-[22px] bg-[#0a0b0e] border border-white/10 p-5 space-y-4">
                                        <div className="h-4 w-28 rounded-lg skeleton-dark" />
                                        {[1, 2, 3, 4, 5].map(i => (
                                            <div key={i} className="space-y-2 pb-3 border-b border-white/[0.06] last:border-b-0">
                                                <div className="h-3 w-20 rounded skeleton-dark" />
                                                <div className="h-4 w-full rounded skeleton-dark" />
                                                <div className="h-4 w-4/5 rounded skeleton-dark" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : isDesktopAspect && navView === 'home' ? (
                            /* DESKTOP NEWSROOM GRID (Sidebar on HOME only; centered full-width on topics) */
                            <div key={`tab_${navView}_${activeTab}_${activeTopic}`} className={`animate-tab-switch w-full mx-auto pt-2 ${activeTab === 'HOME' ? 'max-w-[1600px] grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_380px] gap-8 items-start' : 'max-w-[1380px]'}`}>
                                {/* Left Main Column (70%) */}
                                <div className="min-w-0">
                                    {activeTab === 'HOME' ? (
                                        <JointStrikeDashboard
                                            allArticles={allArticles}
                                            launches={launches}
                                            isSaved={isSaved}
                                            onSelectArticle={selectArticle}
                                            onToggleBookmark={toggleBookmark}
                                            onSelectLaunch={handleSelectLaunch}
                                            onSelectTab={handleTabClick}
                                            onViewAllLaunches={handleMissionsClick}
                                            dataSaver={dataSaver}
                                            Icons={Icons}
                                        />
                                    ) : activeTab === 'AEROSPACE' ? (
                                        <React.Fragment>
                                            <SourceFilterBar
                                                activeTab={activeTab}
                                                activeSourceFilter={activeSourceFilter}
                                                onSelectSource={setActiveSourceFilter}
                                            />
                                            <AerospaceEditorialView
                                                articles={filteredArticles}
                                                launches={launches}
                                                isSaved={isSaved}
                                                onSelectArticle={selectArticle}
                                                onToggleBookmark={toggleBookmark}
                                                onSelectLaunch={handleSelectLaunch}
                                                onViewAllLaunches={handleMissionsClick}
                                                dataSaver={dataSaver}
                                                Icons={Icons}
                                            />
                                        </React.Fragment>
                                    ) : (
                                        <React.Fragment>
                                            {activeTab === 'TOPIC' && activeTopic === 'WEATHER' && (
                                                <WeatherHubHeader rfsAlerts={rfsAlerts} onSelectArticle={selectArticle} />
                                            )}
                                            {(activeTab === 'JUST IN' || activeTab === 'TOPIC') && (
                                                <div className="mb-5 p-4 rounded-2xl bg-[#080808] border border-white/10 flex flex-wrap items-center justify-between gap-4">
                                                    <div>
                                                        <div className="text-[10px] font-black uppercase tracking-[0.2em] text-white/40">
                                                            {activeTab === 'JUST IN' ? 'All Sources | Chronological' : 'Multi-Source Topic Feed'}
                                                        </div>
                                                        <h2 className="text-lg font-extrabold text-white tracking-tight mt-0.5">
                                                            {activeTab === 'JUST IN' ? 'Just In' : (TOPIC_LABELS[activeTopic] || 'Topic Feed')}
                                                            <span className="ml-2 text-xs font-mono text-white/40">({filteredArticles.length})</span>
                                                        </h2>
                                                    </div>
                                                    <label className="inline-flex items-center gap-3 cursor-pointer select-none">
                                                        <span className="text-xs font-bold text-white/80">Show only NSNC Channel Posts</span>
                                                        <button
                                                            type="button"
                                                            role="switch"
                                                            aria-checked={onlyNsncPosts}
                                                            onClick={() => setOnlyNsncPosts(v => !v)}
                                                            className={`w-11 h-6 rounded-full p-0.5 transition-colors cursor-pointer ${onlyNsncPosts ? 'bg-white' : 'bg-white/15'}`}
                                                        >
                                                            <span className={`block w-5 h-5 rounded-full transition-transform ${onlyNsncPosts ? 'translate-x-5 bg-black' : 'translate-x-0 bg-white'}`} />
                                                        </button>
                                                    </label>
                                                </div>
                                            )}
                                            {activeTab === 'OTHER' && (
                                                <OtherUpdatesBoard onExternalLink={handleExternalLink} Icons={Icons} />
                                            )}
                                            <SourceFilterBar
                                                activeTab={activeTab}
                                                activeSourceFilter={activeSourceFilter}
                                                onSelectSource={setActiveSourceFilter}
                                            />

                                            {filteredArticles.length === 0 ? (
                                                <div className="p-10 bg-[#080808] border border-white/10 rounded-[1.5rem] text-center">
                                                    <div className="w-14 h-14 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-5">
                                                        <div className="w-7 h-7 text-white">{Icons.refresh}</div>
                                                    </div>
                                                    <h3 className="text-white font-black text-sm uppercase tracking-widest mb-2">No Articles Found</h3>
                                                    <p className="text-white/40 text-xs">Try refreshing the feed or switching source filters.</p>
                                                </div>
                                            ) : activeTab === 'JUST IN' ? (
                                                <JustInEditorialFeed
                                                    articles={filteredArticles}
                                                    isSaved={isSaved}
                                                    onSelectArticle={selectArticle}
                                                    onToggleBookmark={toggleBookmark}
                                                    dataSaver={dataSaver}
                                                    Icons={Icons}
                                                />
                                            ) : (
                                                <React.Fragment>
                                                    <DesktopHeroCard
                                                        article={filteredArticles[0]}
                                                        isSaved={isSaved(filteredArticles[0])}
                                                        onSelect={selectArticle}
                                                        onToggleBookmark={toggleBookmark}
                                                        dataSaver={dataSaver}
                                                        Icons={Icons}
                                                    />

                                                    {filteredArticles.length > 1 && (
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 mt-5">
                                                            {filteredArticles.slice(1).map((article) => (
                                                                <VisualStoryCard
                                                                    key={article.id}
                                                                    article={article}
                                                                    isSaved={isSaved(article)}
                                                                    onSelect={selectArticle}
                                                                    onToggleBookmark={toggleBookmark}
                                                                    dataSaver={dataSaver}
                                                                    Icons={Icons}
                                                                />
                                                            ))}
                                                        </div>
                                                    )}
                                                </React.Fragment>
                                            )}
                                        </React.Fragment>
                                    )}

                                    {(activeTab === 'STUDENT NEWS' || activeTab === 'HOME') && (
                                        <StudentEditorialDisclaimer className="mt-6 mb-4" />
                                    )}
                                </div>

                                {/* Right Sticky Sidebar (HOME only) */}
                                {activeTab === 'HOME' && (
                                    <div className="min-w-0 space-y-5 sticky top-28">
                                        <NswRfsAlertsCard
                                            alerts={rfsAlerts}
                                            onSelectArticle={selectArticle}
                                            onExternalLink={handleExternalLink}
                                        />
                                        <JustInLiveWire
                                            articles={allArticles}
                                            onSelectArticle={selectArticle}
                                        />
                                        <NswStudentHubWidget
                                            onExternalLink={handleExternalLink}
                                            Icons={Icons}
                                        />
                                    </div>
                                )}
                            </div>
                        ) : (
                            <React.Fragment>
                                {navView === 'home' && activeTab === 'HOME' ? (
                                    <div className="pt-2">
                                        <JointStrikeDashboard
                                            allArticles={allArticles}
                                            launches={launches}
                                            isSaved={isSaved}
                                            onSelectArticle={selectArticle}
                                            onToggleBookmark={toggleBookmark}
                                            onSelectLaunch={handleSelectLaunch}
                                            onSelectTab={handleTabClick}
                                            onViewAllLaunches={handleMissionsClick}
                                            dataSaver={dataSaver}
                                            Icons={Icons}
                                        />
                                        <StudentEditorialDisclaimer className="mt-6 mb-4" />
                                    </div>
                                ) : (
                                    <React.Fragment>
                                {navView === 'home' && activeTab === 'TOPIC' && activeTopic === 'WEATHER' && (
                                    <WeatherHubHeader rfsAlerts={rfsAlerts} onSelectArticle={selectArticle} />
                                )}
                                {navView === 'home' && activeTab === 'OTHER' && (
                                    <OtherUpdatesBoard onExternalLink={handleExternalLink} Icons={Icons} />
                                )}
                                {navView === 'home' && (
                                    <SourceFilterBar
                                        activeTab={activeTab}
                                        activeSourceFilter={activeSourceFilter}
                                        onSelectSource={setActiveSourceFilter}
                                    />
                                )}
                                <div key={`${navView}_${activeTab}_${activeSourceFilter}_${refreshKey}_${layoutMode}`} className={`pt-2 articles-grid layout-${layoutMode}`}>
                                    {(filteredArticles).length === 0 ? (
                                        <div className="col-span-full p-8 bg-[#0a0a0a] border border-white/5 rounded-[2rem] text-center animate-content-blur">
                                            <div className="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6">
                                                <div className="w-8 h-8 text-white">{navView === 'home' ? Icons.refresh : Icons.bookmark}</div>
                                            </div>
                                            <h3 className="text-white font-black text-sm uppercase tracking-widest mb-3">No Articles Found</h3>
                                            <p className="text-[#444] text-[10px] leading-relaxed uppercase font-bold tracking-tight px-4">
                                                {navView === 'home'
                                                    ? "Your connection may not be secure, or this category has no sources assigned."
                                                    : "It seems like you haven't saved any articles yet."}
                                            </p>
                                        </div>
                                    ) : ( (filteredArticles).map((article, idx) => (
                                        <div key={article.id} className="relative group mb-4">
                                            <ArticleCard
                                                article={article}
                                                index={idx}
                                                layoutMode={layoutMode}
                                                isSaved={isSaved(article)}
                                                isRead={isRead(article)}
                                                onSelect={selectArticle}
                                                onToggleBookmark={toggleBookmark}
                                                dataSaver={dataSaver}
                                                isRemoving={removingBookmarkId === article.id}
                                            />
                                        </div>
                                    )) )}
                                </div>
                                {navView === 'home' && activeTab === 'STUDENT NEWS' && (
                                    <StudentEditorialDisclaimer className="mt-6 mb-4" />
                                )}
                                    </React.Fragment>
                                )}
                            </React.Fragment>
                        )}
                        {isDesktopAspect && (
                            <DesktopNewsroomFooter
                                onSelectTab={(tabName) => {
                                    handleTabClick(tabName);
                                }}
                                onSelectTopic={(topicQuery) => {
                                    setSearchQuery(topicQuery);
                                    setIsSearchFocused(true);
                                    setNavView('search');
                                    setIsMissionsActive(false);
                                    scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
                                }}
                                onOpenLaunches={() => {
                                    handleMissionsClick();
                                }}
                                onOpenTeam={() => setShowEditorialTeam(true)}
                                onOpenTerms={() => setShowTermsModal(true)}
                                onOpenAbout={() => {
                                    setNavView('about');
                                    setIsMissionsActive(false);
                                    scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' });
                                }}
                                onOpenAdmin={() => {
                                    setModalView('publish');
                                }}
                                onExternalLink={handleExternalLink}
                            />
                        )}
                    </div>
                )}

                {!selectedArticle && !selectedLaunch && navView !== 'ai' && !isDesktopAspect && <div className="footer-blur-mask"></div>}
                {!selectedArticle && !selectedLaunch && navView !== 'ai' && !isDesktopAspect && (
                    <div className={`bottom-nav-container ${showScrollTop ? 'show-split' : ''}`}>
                        <div className="bottom-nav">
                            {(() => {
                                const navIdx = navView === 'saved' ? 1 : navView === 'about' ? 2 : 0;
                                const offsetPx = isLandscape ? navIdx * 58 : navIdx * 68;
                                return (
                                    <div
                                        className="nav-indicator"
                                        style={{
                                            transform: isLandscape
                                                ? `translateY(${Math.round(offsetPx)}px) translateZ(0)`
                                                : `translateX(${Math.round(offsetPx)}px) translateZ(0)`
                                        }}
                                    />
                                );
                            })()}
                            <div className="nav-items-wrapper">
                                <div
                                    className={`nav-item ${navView === 'home' ? 'active' : ''}`}
                                    onClick={() => { setNavView('home'); scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                    title="Feed"
                                    aria-label="Feed"
                                >
                                    {Icons.home}
                                </div>
                                <div
                                    className={`nav-item ${navView === 'saved' ? 'active' : ''}`}
                                    onClick={() => { setNavView('saved'); scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                    title="Saved"
                                    aria-label="Saved"
                                >
                                    {Icons.bookmark}
                                </div>
                                <div
                                    className={`nav-item ${navView === 'about' ? 'active' : ''}`}
                                    onClick={() => { setNavView('about'); scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                    title="About NSNC"
                                    aria-label="About NSNC"
                                >
                                    {Icons.shield}
                                </div>
                            </div>
                        </div>
                        <div
                            onMouseDown={(e) => e.currentTarget.classList.add('active-btn')}
                            onMouseUp={(e) => e.currentTarget.classList.remove('active-btn')}
                            onTouchStart={(e) => e.currentTarget.classList.add('active-btn')}
                            onTouchEnd={(e) => e.currentTarget.classList.remove('active-btn')}
                            onClick={() => { setIsScrollingUp(true); scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => setIsScrollingUp(false), 800); }}
                            className={`scroll-top-island ${showScrollTop ? 'show' : ''} ${isScrollingUp ? 'is-scrolling active-btn' : ''}`}
                            title="Scroll to Top"
                        >
                            <div className="flex items-center justify-center">
                                <div className="w-5 h-5">{Icons.chevronUp}</div>
                            </div>
                        </div>
                    </div>
                )}
                {!selectedArticle && !selectedLaunch && navView !== 'ai' && isDesktopAspect && showScrollTop && (
                    <button
                        type="button"
                        onClick={() => { setIsScrollingUp(true); scrollRef.current?.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => setIsScrollingUp(false), 800); }}
                        className="fixed bottom-6 right-6 z-[110] w-11 h-11 rounded-full bg-[#0a0a0a] border border-white/15 text-white hover:bg-white hover:text-black shadow-2xl flex items-center justify-center transition-all cursor-pointer btn-spring"
                        title="Scroll to Top"
                        aria-label="Scroll to Top"
                    >
                        <div className="w-4 h-4">{Icons.chevronUp}</div>
                    </button>
                )}
            </div>
        );
    };

    class ErrorBoundary extends React.Component {
        constructor(props) {
            super(props);
            this.state = { hasError: false, error: null };
        }
        static getDerivedStateFromError(error) {
            return { hasError: true, error };
        }
        componentDidCatch(error, errorInfo) {
            console.error("React Error Boundary caught error:", error, errorInfo);
        }
        render() {
            if (this.state.hasError) {
                return (
                    <div style={{ color: '#fff', padding: '32px 24px', fontFamily: 'system-ui, sans-serif', background: '#000', height: '100vh', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', textAlign: 'center' }}>
                        <div style={{ fontSize: '48px', marginBottom: '16px' }}>⚠️</div>
                        <h2 style={{ fontSize: '20px', fontWeight: 'bold', color: '#ef4444', marginBottom: '8px' }}>Application Encountered an Error</h2>
                        <p style={{ fontSize: '12px', color: '#a1a1aa', maxWidth: '320px', marginBottom: '24px', lineHeight: '1.5' }}>{String(this.state.error?.message || this.state.error)}</p>
                        <button onClick={() => { localStorage.clear(); window.location.reload(); }} style={{ background: '#ffffff', color: '#000000', border: 'none', padding: '12px 24px', borderRadius: '999px', fontSize: '13px', fontWeight: 'bold', cursor: 'pointer' }}>Reset Cache & Reload</button>
                    </div>
                );
            }
            return this.props.children;
        }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
        <ErrorBoundary>
            <App />
        </ErrorBoundary>
    );
    if (typeof window.__dismissSplashNow === 'function') {
        window.__dismissSplashNow();
    }
</script>
</body>
</html>
